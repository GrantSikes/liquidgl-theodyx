.thxo-sec .thxo-sec{margin-block-start:0} /* a section nested inside a section does not add rhythm (About wraps its first section) */

.thxo-hero{padding-top:calc(var(--thx-nav-h,56px) + var(--thx-nav-top,12px) + var(--space-xl))} /* hero = nav clearance + one step, monotonic across breakpoints (was 100 / 140 / 118) */
