.thx-nav[data-ink="dark"] .thx-nav-menu a,.thx-nav[data-ink="dark"] .thx-nav-logo,.thx-nav[data-ink="dark"] .thx-nav-burger{color:var(--thx-ink-dark)}
.thx-nav[data-ink="light"] .thx-nav-menu a,.thx-nav[data-ink="light"] .thx-nav-logo,.thx-nav[data-ink="light"] .thx-nav-burger{color:var(--thx-ink-light)}
.thx-nav a:focus-visible,.thx-nav button:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:999px;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent)}
/* --- burger --- */
.thx-nav-burger{display:none;width:44px;height:44px;border:0;border-radius:999px;background:transparent;cursor:pointer;padding:0;align-items:center;justify-content:center;flex-direction:column;gap:5px;transition:background-color 200ms,color 240ms}
.thx-nav-burger:hover{background:color-mix(in srgb,currentColor 12%,transparent)}

.thx-nav[data-open="true"] .thx-nav-burger span:first-child{transform:translateY(3.5px) rotate(45deg)}
.thx-nav[data-open="true"] .thx-nav-burger span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
/* --- expanded mobile sheet: frosted (legibility), inked by the overall backdrop tone --- */
.thx-nav-panel{position:relative;z-index:2;min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s linear 420ms}
.thx-nav-panel-in{padding:6px 14px 18px}

.thx-nav[data-open="true"]{grid-template-rows:auto var(--thx-panel-h,auto);border-radius:28px}

.thx-nav[data-open="true"] .thx-nav-list a,.thx-nav[data-open="true"] .thx-nav-cta{opacity:1;transform:none}
.thx-nav[data-open="true"] .thx-nav-list li:nth-child(2) a{transition-delay:40ms}.thx-nav[data-open="true"] .thx-nav-list li:nth-child(3) a{transition-delay:80ms}.thx-nav[data-open="true"] .thx-nav-list li:nth-child(4) a{transition-delay:120ms}.thx-nav[data-open="true"] .thx-nav-list li:nth-child(5) a{transition-delay:160ms}.thx-nav[data-open="true"] .thx-nav-cta{transition-delay:200ms}
.thx-nav[data-open="true"] .thx-nav-glass,.thx-nav.is-refract[data-open="true"] .thx-nav-glass{background:rgba(12,10,16,.80);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);inset:0;border-radius:inherit;clip-path:none}

.thx-nav[data-tone="light"][data-open="true"] .thx-nav-glass{background:rgba(255,255,255,.86)}
.thx-nav[data-tone="light"][data-open="true"] .thx-nav-list a{color:#0c0a10}
.thx-nav[data-tone="light"][data-open="true"] .thx-nav-list a:hover{background:rgba(12,10,16,.07)}

@supports (animation-timeline:scroll()){@media (prefers-reduced-motion:no-preference){.thx-nav.has-sda:not([data-open="true"]){animation:thx-nav-condense linear both;animation-timeline:scroll(root);animation-range:0 120px;transition:border-radius 420ms var(--thx-nav-ease),grid-template-rows 420ms var(--thx-nav-ease)}.thx-nav.has-sda.is-scrolled{transform:none}}}
